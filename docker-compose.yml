version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '5002:3000'
    environment:
      - DATABASE_URL=postgresql://cnc_user:cnc_password@db:5432/cnc_erp
      - NODE_ENV=production
      # 송장 OCR 서버(아래 ocr) — 없거나 꺼져 있어도 ERP 는 정상, '송장 스캔 입고'만 안내 후 실패
      - OCR_URL=http://ocr:8000
    volumes:
      # 사용자 업로드 영구화 — 컨테이너 재빌드해도 사진 유지
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cnc_user
      - POSTGRES_PASSWORD=cnc_password
      - POSTGRES_DB=cnc_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5003:5432'
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnc_user -d cnc_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 철판 입고송장 OCR (2026-10-02) — 설치형·CPU 전용, 외부 포트 없음(app 만 내부망으로 호출).
  # 처음 한 번: sudo docker compose up --build -d ocr   (이후 app 배포와 무관하게 계속 떠 있음)
  ocr:
    build:
      context: ./ocr
    environment:
      - OCR_THREADS=2
    mem_limit: 1536m
    restart: always

  # 깃허브 소스 동기화용 서비스 (나스에 git이 없을 때 사용)
  git-sync:
    image: alpine/git
    volumes:
      - .:/git
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    working_dir: /git
    entrypoint: ["sh", "-c"]
    command:
      - |
        git config --global --add safe.directory /git
        if [ -z "$GITHUB_TOKEN" ]; then
          echo "GITHUB_TOKEN is not set. Using existing credentials."
          git pull origin master
        else
          echo "Using GITHUB_TOKEN for sync."
          git pull https://x-access-token:${GITHUB_TOKEN}@github.com/banlan21-maker/erp.git master
        fi

volumes:
  pgdata:
    # NAS 영구 스토리지 — 컨테이너 재시작 후에도 데이터 보존
